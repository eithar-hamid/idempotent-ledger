spring.application.name=idempotent-ledger

# Local run: `docker compose up -d` starts PostgreSQL on 5432 (see compose.yaml).
# Tests and TestIdempotentLedgerApplication use Testcontainers instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger
spring.datasource.username=ledger
spring.datasource.password=ledger

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
